name: Build apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows installer
            command: npx electron-builder --win --publish never
            files: dist/*.exe
            artifact: morning-timetable-windows
          - os: macos-latest
            name: Mac installer
            command: npx electron-builder --mac --publish never
            files: dist/*.dmg
            artifact: morning-timetable-mac
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        shell: bash
        run: |
          mkdir -p www build assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f icon.png ]; then mv icon.png build/icon.png; fi
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
          ls -R www build assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        shell: bash
        run: |
          mkdir -p www build assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f icon.png ]; then mv icon.png build/icon.png; fi
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
          ls -R www build assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: morning-timetable-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish download links
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: mv files/app-debug.apk files/Morning-Timetable-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Morning Timetable (build ${{ github.run_number }})
          files: |
            files/*.exe
            files/*.dmg
            files/Morning-Timetable-Android.apk
